name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and run tests
        run: mvn -T 1C -B clean test

  build-and-push:
    name: Build Docker images and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reader image
        uses: docker/build-push-action@v5
        with:
          context: ./reader
          file: reader/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/reader:latest
          build-args: |
            JAVA_VERSION=21

      - name: Build and push writer image
        uses: docker/build-push-action@v5
        with:
          context: ./writer
          file: writer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/writer:latest
          build-args: |
            JAVA_VERSION=21
