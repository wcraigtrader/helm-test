name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and run tests
        run: mvn -T 1C -B clean test

  build-and-push:
    name: Build Docker images and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Load GHCR credentials from local file (if present)
        id: load-ghcr
        run: |
          FILE="$HOME/.keys/github.token"
          if [ -f "$FILE" ]; then
            content=$(cat "$FILE")
            # If file contains 'user:pass' on one line
            if echo "$content" | grep -q ':'; then
              user=${content%%:*}
              pass=${content#*:}
            else
              # If file has two lines, first=user second=pass
              user=$(echo "$content" | sed -n '1p')
              pass=$(echo "$content" | sed -n '2p')
              # If still empty pass, treat whole content as token
              if [ -z "$pass" ]; then
                pass="$content"
                user="${{ github.repository_owner }}"
              fi
            fi
            echo "GHCR_USERNAME=$user" >> $GITHUB_ENV
            echo "GHCR_PASSWORD=$pass" >> $GITHUB_ENV
          else
            echo "GHCR_USERNAME=${{ github.repository_owner }}" >> $GITHUB_ENV
            echo "GHCR_PASSWORD=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Build and push reader image
        uses: docker/build-push-action@v5
        with:
          context: ./reader
          file: reader/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_USERNAME }}/reader:latest
          build-args: |
            JAVA_VERSION=21

      - name: Build and push writer image
        uses: docker/build-push-action@v5
        with:
          context: ./writer
          file: writer/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_USERNAME }}/writer:latest
          build-args: |
            JAVA_VERSION=21

      - name: Build and push webapp image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          file: webapp/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_USERNAME }}/webapp:latest
